version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: meta-automation-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: meta-automation
    volumes:
      - mongodb_data:/data/db
    networks:
      - meta-automation-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meta-automation-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://admin:admin123@mongodb:27017/meta-automation?authSource=admin
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - meta-automation-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meta-automation-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - meta-automation-network

volumes:
  mongodb_data:

networks:
  meta-automation-network:
    driver: bridge
